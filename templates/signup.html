<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – LuminCards</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <span class="auth-logo">🧠</span>
        <h1>Create Account</h1>
        <p class="auth-subtitle">Start building your flashcard library today</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-messages">
                    {% for msg in messages %}<div class="flash-msg">{{ msg }}</div>{% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('signup') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required minlength="3" placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6" placeholder="At least 6 characters">
            </div>
            <button type="submit" class="auth-btn">Create Account →</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
        <a href="{{ url_for('index') }}" class="auth-back">← Back to Home</a>
    </div>
</div>
</body>
</html>
